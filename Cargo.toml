[package]
name = "astralane"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
governor = "0.6"
rusqlite = { version = "0.31", features = ["bundled"] }
rand = { version = "0.10.0-rc.9" }
axum = "0.7"
tower-http = { version = "0.6", features = ["fs"] }
